databases:
  - name: book-scanner-db
    plan: free

services:
  - type: web
    name: book-scanner-reader
    runtime: node
    plan: free
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend && npm install --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: GOOGLE_PROJECT_ID
        sync: false
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: book-scanner-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
